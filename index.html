        /* Contenedor principal */

        .menu-container {
            width: 340px;
            min-height: 500px;

            padding: 45px 35px;

        .menu-button {
            display: block;

            width: 100%;
            padding: 17px 10px;

            margin: 16px 0;

            background: rgba(15, 17, 38, 0.35);

            border: 1px solid rgba(160, 165, 200, 0.22);

            color: #aaa9bb;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            letter-spacing: 2px;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }

        .menu-button:hover {
            background: rgba(90, 95, 135, 0.12);

            border-color: rgba(190, 195, 225, 0.45);

            color: #dddce7;

            transform: translateY(-2px);
        }
